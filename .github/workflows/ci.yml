name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mypanel
          POSTGRES_USER: panel
          POSTGRES_PASSWORD: panel-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U panel -d mypanel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PANEL_ROOT_DIR: ${{ github.workspace }}/backend
      PANEL_JWT_SECRET: ci-jwt-secret-ci-jwt-secret-ci-jwt-secret
      PANEL_ALLOW_INSECURE_DEFAULTS: 'true'
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: mypanel
      DB_USER: panel
      DB_PASSWORD: panel-ci-password
      REALITY_PRIVATE_KEY: ci-private
      REALITY_PUBLIC_KEY: ci-public
      HY2_TRAFFIC_SECRET: ci-traffic-secret
      HY2_OBFS_PASSWORD: ci-obfs-secret
      PANEL_DISABLE_SYSTEMCTL: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Download modules
        working-directory: backend
        run: go mod download
      - name: Test
        working-directory: backend
        run: go test ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Systemd unit syntax
        run: |
          sudo groupadd --system panel || true
          sudo useradd --system --gid panel --shell /usr/sbin/nologin panel || true
          sudo useradd --system --shell /usr/sbin/nologin xray || true
          sudo useradd --system --groups panel --shell /usr/sbin/nologin hysteria || true
          sudo install -d /opt/mypanel/bin /usr/local/bin
          sudo install -m 0755 /bin/true /opt/mypanel/bin/panel
          sudo install -m 0755 /bin/true /usr/local/bin/xray
          sudo install -m 0755 /bin/true /usr/local/bin/hysteria
          systemd-analyze verify units/*.service units/*.timer
      - name: Migration smoke
        working-directory: backend
        run: go run ./cmd/panel migrate up

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
